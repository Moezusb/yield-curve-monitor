name: Update yield data

on:
  schedule:
    # Weekdays, after Treasury, BoC and ECB have all published (times in UTC)
    - cron: "43 23 * * 1-5"
    - cron: "43 15 * * 1-5"
  workflow_dispatch:
  push:
    branches: [redesign]
    paths: ["scripts/**", ".github/workflows/**"]

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch yields
        run: python scripts/fetch_yields.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yields.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh yields"
            git push
          fi
